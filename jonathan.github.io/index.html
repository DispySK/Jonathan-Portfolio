<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jonathan Amzalag – Developer</title>
  <meta name="description" content="Portfolio of a junior developer working with Java, Angular, Svelte, Vue and Python.">

  <script>
    try {
      var t = localStorage.getItem('portfolio-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="#projects">Projects</a>
      <a href="#about">About</a>
      <a href="#contact">Contact me!</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button"></button>
  </header>

  <main id="main">
    <section class="hero" id="hero" aria-labelledby="hero-name"></section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <h2 id="projects-title">Projects</h2>
      <div class="filters" id="project-filters" role="group" aria-label="Filter projects by tag"></div>
      <div id="project-list"></div>
    </section>

    <section class="section" id="about" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <div class="about-grid">

    <section class="section" id="skills" aria-labelledby="skills-title">
      <h2 id="skills-title">Skills</h2>
      <div id="skills-list"></div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Contact</h2>
      <div id="contact-body"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built with simple plain HTML, CSS and JavaScript.</p>
  </footer>

  <noscript><p class="noscript">This page needs JavaScript to show its content.</p></noscript>
  <script type="module" src="js/main.js"></script>

</html>
